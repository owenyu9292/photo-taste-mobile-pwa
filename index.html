<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Taste Mobile</title>
  <meta name="theme-color" content="#0b0d10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Photo Taste Mobile</h1>
        <p>오빠가 누워서 고르는 취향 패치</p>
      </div>
    </header>

    <section class="viewer panel">
      <div class="workbar">
        <button class="primary" id="chooseBtn" type="button">이미지 선택</button>
        <button id="clearBtn" type="button">비우기</button>
        <span class="status" id="status">0장</span>
        <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
      </div>

      <div class="image-stage" id="imageStage">
        <div class="empty">이미지를 선택하세요</div>
        <img id="activeImage" alt="">
      </div>
      <div class="meta">
        <h2 id="activeTitle">선택 없음</h2>
        <div class="chips" id="sourceChips"></div>
        <div class="chips" id="tasteChips"></div>
        <label>느낌 태그
          <textarea id="tagInput" placeholder="지금 든 느낌을 그대로 적어요"></textarea>
        </label>
        <label>메모
          <textarea id="noteInput" placeholder="그때 감정이나 이유를 그대로 남겨요"></textarea>
        </label>
      </div>
    </section>

    <section class="panel">
      <h2>목록</h2>
      <div class="queue" id="queue"></div>
    </section>

    <section class="finish panel">
      <div>
        <h2>마무리</h2>
        <p class="status" id="exportSummary">0장 패치 준비</p>
      </div>
      <button class="primary export-btn" id="exportBtn" type="button">패치 내보내기</button>
    </section>
  </main>
  <script src="app.js?v=5"></script>
</body>
</html>
